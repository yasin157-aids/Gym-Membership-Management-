{% extends "base.html" %}{% block content %}<div class="page-header"><h1>Members</h1><a class="button" href="{{url_for('add_member')}}">+ Add Member</a></div><form class="search"><input name="search" value="{{search}}" placeholder="Search"><button>Search</button></form><section class="card"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Goal</th><th>Trainer</th><th>Action</th></tr>{% for m in members %}<tr><td>{{m.member_id}}</td><td>{{m.name}}</td><td>{{m.phone}}</td><td>{{m.fitness_goal}}</td><td>{{m.trainer_name or '-'}}</td><td><a class="danger-link" href="{{url_for('delete_member',mid=m.member_id)}}" onclick="return confirm('Delete?')">Delete</a></td></tr>{% endfor %}</table></section>{% endblock %}
