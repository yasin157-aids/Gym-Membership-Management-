{% extends "base.html" %}{% block content %}<div class="page-header"><h1>Payments</h1><a class="button" href="{{url_for('add_payment')}}">+ Record Payment</a></div><section class="card"><table><tr><th>Member</th><th>Amount</th><th>Date</th><th>Method</th></tr>{% for r in rows %}<tr><td>{{r.member_name}}</td><td>₹{{'%.0f'|format(r.amount)}}</td><td>{{r.payment_date}}</td><td>{{r.payment_method}}</td></tr>{% endfor %}</table></section>{% endblock %}
