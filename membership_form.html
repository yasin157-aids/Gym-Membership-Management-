{% extends "base.html" %}{% block content %}<section class="card form-card"><h1>Add Membership</h1><form method="post" class="form-grid"><label>Member<select name="member_id">{% for m in members %}<option value="{{m.member_id}}">{{m.name}}</option>{% endfor %}</select></label><label>Plan<select name="plan"><option>Monthly</option><option>Quarterly</option><option>Half-Yearly</option><option>Annual</option></select></label><label>Start<input type="date" name="start" required></label><label>End<input type="date" name="end" required></label><label>Fee<input type="number" name="fee" required></label><label>Status<select name="status"><option>Active</option><option>Expired</option></select></label><label>Record Payment?<select name="record_payment"><option value="yes">Yes</option><option value="no">No</option></select></label><label>Payment Method<select name="payment_method"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank Transfer</option></select></label><button>Save Membership</button></form></section>{% endblock %}
