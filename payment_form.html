{% extends "base.html" %}{% block content %}<section class="card form-card"><h1>Record Payment</h1><form method="post" class="form-grid"><label>Member<select name="member_id">{% for m in members %}<option value="{{m.member_id}}">{{m.name}}</option>{% endfor %}</select></label><label>Amount<input type="number" name="amount" required></label><label>Date<input type="date" name="payment_date" required></label><label>Method<select name="method"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank Transfer</option></select></label><button>Record Payment</button></form></section>{% endblock %}
