{% extends "base.html" %}{% block content %}<section class="card form-card"><h1>Add Member</h1><form method="post" class="form-grid"><label>Name<input name="name" required></label><label>DOB<input type="date" name="dob"></label><label>Gender<select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Phone<input name="phone"></label><label>Email<input name="email"></label><label>Address<input name="address"></label><label>Emergency<input name="emergency"></label><label>Join Date<input type="date" name="join_date" required></label><label>Height<input type="number" name="height"></label><label>Weight<input type="number" name="weight"></label><label>Goal<select name="goal"><option>Weight Loss</option><option>Muscle Gain</option><option>Fitness</option><option>Strength</option></select></label><label>Blood Group<input name="blood_group"></label><label>Trainer<select name="trainer_id"><option value="">None</option>{% for t in trainers %}<option value="{{t.trainer_id}}">{{t.name}}</option>{% endfor %}</select></label><button>Save Member</button></form></section>{% endblock %}
