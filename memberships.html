{% extends "base.html" %}{% block content %}<div class="page-header"><h1>Memberships</h1><a class="button" href="{{url_for('add_membership')}}">+ Add Membership</a></div><section class="card"><table><tr><th>Member</th><th>Plan</th><th>Start</th><th>End</th><th>Fee</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{r.member_name}}</td><td>{{r.plan_name}}</td><td>{{r.start_date}}</td><td>{{r.end_date}}</td><td>₹{{'%.0f'|format(r.fee)}}</td><td>{{r.status}}</td></tr>{% endfor %}</table></section>{% endblock %}
