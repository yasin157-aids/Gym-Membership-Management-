{% extends "base.html" %}{% block content %}<section class="card form-card"><h1>Record Attendance</h1><form method="post" class="form-grid"><label>Member<select name="member_id">{% for m in members %}<option value="{{m.member_id}}">{{m.name}}</option>{% endfor %}</select></label><label>Date<input type="date" name="attendance_date" required></label><label>Status<select name="status"><option>Present</option><option>Absent</option></select></label><button>Save Attendance</button></form></section>{% endblock %}
